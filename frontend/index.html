<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>崩坏3 AI 助手</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚡</text></svg>" type="image/svg+xml">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .chat-container {
            width: 100%;
            max-width: 1000px;
            height: 750px;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .chat-header {
            background: linear-gradient(135deg, #e91e63 0%, #9c27b0 100%);
            color: white;
            padding: 20px;
            text-align: center;
        }

        .chat-header h1 {
            font-size: 24px;
            font-weight: 600;
        }

        .chat-header p {
            font-size: 14px;
            opacity: 0.9;
            margin-top: 5px;
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            background: #f8f9fa;
        }

        .message {
            margin-bottom: 20px;
            display: flex;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message.assistant {
            justify-content: flex-start;
        }

        .message.user {
            justify-content: flex-end;
        }

        .message-content {
            max-width: 80%;
            padding: 12px 18px;
            border-radius: 20px;
            line-height: 1.6;
            word-break: break-word;
        }

        .assistant .message-content {
            background: #e91e63;
            color: white;
            border-radius: 20px 20px 20px 5px;
        }

        .user .message-content {
            background: #2196f3;
            color: white;
            border-radius: 20px 20px 5px 20px;
        }

        .message-role {
            font-size: 12px;
            opacity: 0.8;
            margin-bottom: 5px;
        }

        .chat-input {
            padding: 20px;
            background: white;
            border-top: 1px solid #eee;
            display: flex;
            gap: 10px;
        }

        .chat-input input {
            flex: 1;
            padding: 15px 20px;
            border: 2px solid #ddd;
            border-radius: 30px;
            font-size: 15px;
            outline: none;
            transition: border-color 0.3s;
        }

        .chat-input input:focus {
            border-color: #e91e63;
        }

        .chat-input button {
            padding: 15px 30px;
            background: linear-gradient(135deg, #e91e63 0%, #9c27b0 100%);
            color: white;
            border: none;
            border-radius: 30px;
            font-size: 15px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .chat-input button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(233, 30, 99, 0.4);
        }

        .chat-input button:active {
            transform: translateY(0);
        }

        .typing-indicator {
            display: flex;
            gap: 5px;
            padding: 12px 18px;
            background: #e91e63;
            color: white;
            border-radius: 20px 20px 20px 5px;
            max-width: 70%;
        }

        .typing-dot {
            width: 8px;
            height: 8px;
            background: white;
            border-radius: 50%;
            animation: typing 1.4s infinite ease-in-out;
        }

        .typing-dot:nth-child(1) { animation-delay: 0s; }
        .typing-dot:nth-child(2) { animation-delay: 0.2s; }
        .typing-dot:nth-child(3) { animation-delay: 0.4s; }

        @keyframes typing {
            0%, 80%, 100% { opacity: 0.3; }
            40% { opacity: 1; }
        }

        .status-bar {
            background: #f0f0f0;
            padding: 8px 20px;
            font-size: 12px;
            color: #666;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .status-online {
            width: 8px;
            height: 8px;
            background: #4caf50;
            border-radius: 50%;
            margin-right: 8px;
        }

        .status-offline {
            width: 8px;
            height: 8px;
            background: #f44336;
            border-radius: 50%;
            margin-right: 8px;
        }

        pre {
            background: rgba(255, 255, 255, 0.2);
            padding: 10px;
            border-radius: 8px;
            overflow-x: auto;
            font-size: 13px;
            white-space: pre-wrap;
            word-break: break-all;
            margin: 8px 0;
        }

        code {
            background: rgba(255, 255, 255, 0.2);
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 13px;
        }

        .thinking-box {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 15px;
            border-radius: 12px;
            margin: 10px 0;
            color: white;
            font-size: 14px;
        }

        .thinking-box .thinking-label {
            font-weight: bold;
            margin-bottom: 5px;
            font-size: 12px;
            opacity: 0.8;
        }

        .action-box {
            background: linear-gradient(135deg, #ff9800 0%, #f57c00 100%);
            padding: 15px;
            border-radius: 12px;
            margin: 10px 0;
            color: white;
            font-size: 14px;
        }

        .action-box .action-label {
            font-weight: bold;
            margin-bottom: 5px;
            font-size: 12px;
            opacity: 0.8;
        }

        .observation-box {
            background: linear-gradient(135deg, #4caf50 0%, #388e3c 100%);
            padding: 15px;
            border-radius: 12px;
            margin: 10px 0;
            color: white;
            font-size: 14px;
        }

        .observation-box .observation-label {
            font-weight: bold;
            margin-bottom: 5px;
            font-size: 12px;
            opacity: 0.8;
        }

        ::-webkit-scrollbar {
            width: 6px;
        }

        ::-webkit-scrollbar-track {
            background: #f1f1f1;
        }

        ::-webkit-scrollbar-thumb {
            background: #ccc;
            border-radius: 3px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #999;
        }
    </style>
</head>
<body>
    <div class="chat-container">
        <div class="chat-header">
            <h1>🎮 崩坏3 AI 助手</h1>
            <p>基于 DeepSeek V4 API | ReAct Agent</p>
        </div>

        <div class="status-bar">
            <div class="status">
                <span class="status-online"></span>
                <span id="connection-status">已连接</span>
            </div>
            <div class="model-info">
                <span id="model-name">DeepSeek V4 Flash</span>
            </div>
        </div>

        <div class="chat-messages" id="chat-messages">
            <div class="message assistant">
                <div class="message-content">
                    <div class="message-role">🎯 助手</div>
                    您好！我是崩坏3专属AI助手，请问有什么可以帮助您的？
                    <br><br>
                    <strong>可用技能：</strong>
                    <ul style="margin-top: 8px; margin-left: 20px; font-size: 14px;">
                        <li>🔍 RAG知识库搜索</li>
                        <li>🖼️ YOLO模型检测/分类</li>
                        <li>🎮 游戏窗口聚焦</li>
                        <li>🖱️ 点击指定坐标</li>
                        <li>📊 系统状态查询</li>
                    </ul>
                </div>
            </div>
        </div>

        <div class="chat-input">
            <input type="text" id="user-input" placeholder="输入您的消息..." autocomplete="off">
            <button id="send-button">发送</button>
        </div>
    </div>

    <script>
        const API_BASE = 'http://localhost:8000';
        const chatMessages = document.getElementById('chat-messages');
        const userInput = document.getElementById('user-input');
        const sendButton = document.getElementById('send-button');
        const connectionStatus = document.getElementById('connection-status');

        let isTyping = false;

        function addMessage(role, content) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${role}`;
            
            const contentDiv = document.createElement('div');
            contentDiv.className = 'message-content';
            
            const roleDiv = document.createElement('div');
            roleDiv.className = 'message-role';
            roleDiv.textContent = role === 'assistant' ? '🎯 助手' : '👤 用户';
            
            const textDiv = document.createElement('div');
            textDiv.innerHTML = formatMessage(content);
            
            contentDiv.appendChild(roleDiv);
            contentDiv.appendChild(textDiv);
            messageDiv.appendChild(contentDiv);
            
            chatMessages.appendChild(messageDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        function addThinkingStep(thought, action, actionInput, observation) {
            const messageDiv = document.createElement('div');
            messageDiv.className = 'message assistant';
            
            const contentDiv = document.createElement('div');
            contentDiv.className = 'message-content';
            
            const roleDiv = document.createElement('div');
            roleDiv.className = 'message-role';
            roleDiv.textContent = '🧠 ReAct 思考过程';
            
            const stepsDiv = document.createElement('div');
            
            if (thought) {
                const thoughtBox = document.createElement('div');
                thoughtBox.className = 'thinking-box';
                thoughtBox.innerHTML = `<div class="thinking-label">💡 思考</div>${formatMessage(thought)}`;
                stepsDiv.appendChild(thoughtBox);
            }
            
            if (action) {
                const actionBox = document.createElement('div');
                actionBox.className = 'action-box';
                actionBox.innerHTML = `<div class="action-label">⚡ 动作</div><strong>工具:</strong> ${action}<br><strong>参数:</strong> ${actionInput || '无'}`;
                stepsDiv.appendChild(actionBox);
            }
            
            if (observation) {
                const observationBox = document.createElement('div');
                observationBox.className = 'observation-box';
                observationBox.innerHTML = `<div class="observation-label">📝 结果</div>${formatMessage(observation)}`;
                stepsDiv.appendChild(observationBox);
            }
            
            contentDiv.appendChild(roleDiv);
            contentDiv.appendChild(stepsDiv);
            messageDiv.appendChild(contentDiv);
            
            chatMessages.appendChild(messageDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        function formatMessage(text) {
            if (!text) return '';
            text = text.replace(/```(\w+)?\n([\s\S]*?)```/g, '<pre>$2</pre>');
            text = text.replace(/`([^`]+)`/g, '<code>$1</code>');
            text = text.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
            text = text.replace(/\n/g, '<br>');
            return text;
        }

        function showTyping() {
            if (isTyping) return;
            isTyping = true;
            
            const typingDiv = document.createElement('div');
            typingDiv.className = 'message assistant';
            typingDiv.id = 'typing-indicator';
            
            const contentDiv = document.createElement('div');
            contentDiv.className = 'typing-indicator';
            
            for (let i = 0; i < 3; i++) {
                const dot = document.createElement('span');
                dot.className = 'typing-dot';
                contentDiv.appendChild(dot);
            }
            
            typingDiv.appendChild(contentDiv);
            chatMessages.appendChild(typingDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        function hideTyping() {
            isTyping = false;
            const typingIndicator = document.getElementById('typing-indicator');
            if (typingIndicator) {
                typingIndicator.remove();
            }
        }

        async function sendMessage() {
            const message = userInput.value.trim();
            if (!message) return;

            addMessage('user', message);
            userInput.value = '';
            
            showTyping();

            try {
                const response = await fetch(`${API_BASE}/api/chat`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        messages: [{role: 'user', content: message}],
                        use_rag: true,
                        stream: false,
                        show_thinking: true
                    })
                });

                const data = await response.json();
                
                hideTyping();
                
                if (data.thinking_steps && Array.isArray(data.thinking_steps)) {
                    data.thinking_steps.forEach(step => {
                        addThinkingStep(step.thought, step.action, step.action_input, step.observation);
                    });
                }
                
                addMessage('assistant', data.message?.content || '未收到回复');
            } catch (error) {
                hideTyping();
                addMessage('assistant', `❌ 网络错误: ${error.message}`);
                connectionStatus.innerHTML = '<span class="status-offline"></span>连接失败';
            }
        }

        userInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        sendButton.addEventListener('click', sendMessage);

        async function checkConnection() {
            try {
                await fetch(`${API_BASE}/api/health`);
                connectionStatus.innerHTML = '<span class="status-online"></span>已连接';
            } catch {
                connectionStatus.innerHTML = '<span class="status-offline"></span>未连接';
            }
        }

        checkConnection();
    </script>
</body>
</html>
